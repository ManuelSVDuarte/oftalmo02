<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia Interativa do Olho 3D</title>
    
    <!-- Conectando nosso arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Resolve o erro 404 do favicon -->
    <link rel="icon" href="data:,">

    <!-- Mapa de Importação: Ensina o navegador onde encontrar o "three" -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <div id="app">
        <div id="conteiner-3d">
            <button id="btn-estratificar">Separar em Camadas (Estratificar)</button>
        </div>

        <aside id="painel-info">
            <div id="painel-conteudo">
                <p id="mensagem-inicial">
                    Gire o modelo 3D usando o mouse.<br><br>
                    <strong>Clique em uma estrutura do olho</strong> para ver suas informações, anatomia e correlações clínicas.
                </p>
            </div>
        </aside>
    </div>

    <script type="module" src="app.js"></script>

</html>
